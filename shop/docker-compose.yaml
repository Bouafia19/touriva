services:
  mongo_db:
    container_name: touriva_shop_db
    image: mongo:7.0
    restart: always
    volumes:
      - touriva_shop_mongo_db:/data/db
    ports:
      - "27019:27017"

  shop_api:
    build: ./backend
    container_name: touriva_shop_api
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo_db:27017/touriva_shop
      SECRET: ${SECRET:-touriva_shop_secret_token_2026}
      ACCOUNT_SID: ${ACCOUNT_SID:-}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      SERVICE_ID: ${SERVICE_ID:-}
    depends_on:
      - mongo_db
    restart: unless-stopped
    ports:
      - "5000:5000"

  shop_web:
    build: ./frontEnd/touriva_shop_web
    container_name: touriva_shop_web
    depends_on:
      - shop_api
    restart: unless-stopped
    ports:
      - "3000:80"

  shop_admin:
    build: ./frontEnd/touriva_shop_admin
    container_name: touriva_shop_admin
    depends_on:
      - shop_api
    restart: unless-stopped
    ports:
      - "3001:80"

  shop_seller_admin:
    build: ./frontEnd/touriva_shop_seller_admin
    container_name: touriva_shop_seller_admin
    depends_on:
      - shop_api
    restart: unless-stopped
    ports:
      - "3002:80"

volumes:
  touriva_shop_mongo_db: {}
