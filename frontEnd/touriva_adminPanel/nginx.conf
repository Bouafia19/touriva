events {}
http {
    include /etc/nginx/mime.types;
    sendfile on;
    server {
        listen 80;
        server_name _;

        location / {
            root /usr/share/nginx/html/admin;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }
    }
}
