events {}
http {
    include /etc/nginx/mime.types;
    sendfile on;
    server {
        listen 80;
        # server_name bildoz.com.dz;
        server_name 192.168.1.7;
        # server_name 192.168.100.100;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}