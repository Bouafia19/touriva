worker_processes auto;

events {
    worker_connections 1024;
}

http {

    # proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=bildoz_cache:5m max_size=500m inactive=60m;

    server {
        listen 80;
        server_name djawal.com;
        # server_name 192.168.1.7;
        # server_name 192.168.100.100;

        location / {
            return 301 https://$host$request_uri;
        }


    }

    server {
        listen 443 ssl;
        server_name djawal.com;
        # server_name 192.168.1.7;
        # server_name 192.168.100.100;

        ssl_certificate /etc/nginx/ssl/djawal.crt;
        ssl_certificate_key /etc/nginx/ssl/djawal.key;
        
        client_max_body_size 50M;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;
        sendfile on;
        tcp_nopush on;
        gzip on;
        gzip_comp_level 3;
        gzip_types
            text/plain
            text/css
            application/json
            application/javascript
            text/javascript
            application/xml
            application/xhtml+xml;
        gzip_vary on;

        location / {
            proxy_pass http://web_client/;
        }

        location /admin {
            proxy_pass http://admin_panel/;
        }

        location /api/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;

            # proxy_cache_bypass $cookie_nocache $arg_nocache;

            # proxy_cache bildoz_cache;
            # proxy_cache_valid 200 10m;
            # proxy_cache_methods GET HEAD POST;
            # proxy_cache_min_uses 5;
            # proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;

            # add_header X-Cache-Status $upstream_cache_status;

            proxy_pass http://api:4000/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ===== BOUTIQUE API =====
        location /shop/api/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;

            proxy_pass http://shop_api:5000/;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ===== BOUTIQUE SHOP =====
        location /shop/ {
            proxy_pass http://shop_web/;
        }

        # ===== BOUTIQUE ADMIN =====
        location /shop/admin/ {
            proxy_pass http://shop_admin/;
        }


    }

    # upstream nodes {
    #     # enable sticky session with either "hash" (uses the complete IP address)
    #     ip_hash;
       
    #     server api-1:4000;
    #     server api-2:4000;
    #     server api-3:4000;
    #     server api-4:4000;
    #     server api-5:4000;
    #     server api-6:4000;
    #     server api-7:4000;
    #     server api-8:4000;
    #     server api-9:4000;
    #     server api-10:4000;
    # }
}
