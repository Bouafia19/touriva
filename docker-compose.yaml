services:
  mongo_db:
    container_name: touriva_db
    image: mongo:7.0
    restart: always
    volumes:
      - touriva_mongo_db:/data/db
    ports:
      - "27018:27017"

  api:
    build: ./backend
    container_name: touriva_api
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo_db:27017/touriva
      SECRET: ${SECRET:-touriva_production_secure_secret_token_2026}
      ACCOUNT_SID: ${ACCOUNT_SID:-}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      SERVICE_ID: ${SERVICE_ID:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      NODE_ENV: production
      CORS_ORIGINS: "*"
    depends_on:
      - mongo_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - "4000:4000"

  admin_panel:
    build: ./frontEnd/touriva_adminPanel
    container_name: touriva_admin_panel
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "2021:80"

  web_client:
    build: ./frontEnd/touriva
    container_name: touriva_web
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "2020:80"

  nginx:
    build: ./nginx
    container_name: touriva_nginx
    volumes:
      - ./nginx/touriva.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - admin_panel
      - web_client
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  touriva_mongo_db: {}
